name: Scan application for known security vulnerabilities

on:
  workflow_call:
    inputs:
      sec_tool:
        description: "The security tool to use for scanning (e.g., npm, pip, etc.)."
        type: string
      ghcr_image:
        description: "The GitHub Container Registry image to run sec tools within and for scanning with trivy (e.g., ghcr.io/username/repo:tag)."
        type: string
      artifact_name:
        description: "The name of the artifact to download and scan (e.g., myapp-build)."
        type: string
      container_scan:
        description: "Whether to perform a container scan using trivy"
        type: boolean
        required: false
      ignore_vulns:
        description: "If true, vulnerability findings won't fail the workflow."
        type: boolean
        required: false
        default: false
      artifact_s3_bucket:
        description: "Optional S3 bucket used when GitHub artifact download fails."
        type: string
        required: false
        default: ''
      artifact_s3_path:
        description: "Directory in artifact_s3_bucket for fallback artifacts."
        type: string
        required: false
        default: '/'
      aws_region:
        description: "AWS region for the S3 artifact fallback."
        type: string
        required: false
      aws_role_to_assume:
        description: "AWS role for the S3 artifact fallback."
        type: string
        required: false

jobs:
  oss:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Validate input
        env:
          SEC_TOOL: ${{ inputs.sec_tool }}
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          CONTAINER_SCAN: ${{ inputs.container_scan }}
        run: |
          set -euo pipefail

          errors=0

          SUPPORTED_TOOLS=("npm" "pip" "composer")

          if [[ -n "${GHCR_IMAGE}" && -n "${ARTIFACT_NAME}" ]]; then
            echo "::error::Both 'ghcr_image' and 'artifact_name' are provided. Please provide only one."
            errors=1
          fi

          if [[ -z "${GHCR_IMAGE}" && -z "${ARTIFACT_NAME}" ]]; then
            echo "::error::Neither 'ghcr_image' nor 'artifact_name' is provided. Please provide exactly one."
            errors=1
          fi

          if [[ -z "${SEC_TOOL}" ]]; then
            echo "::error::'sec_tool' input is required (e.g., npm, pip)."
            errors=1
          else
            case "${SEC_TOOL}" in
              npm)
                echo "Security tool '${SEC_TOOL}' (javascript) is supported."
                ;;
              pip)
                echo "Security tool '${SEC_TOOL}' (python) is supported."
                ;;
              composer)
                echo "Security tool '${SEC_TOOL}' (php) is supported."
                ;;
              *)
                echo "::error::Unsupported 'sec_tool' value: '${SEC_TOOL}'. Supported: ${SUPPORTED_TOOLS[*]}."
                errors=1
                ;;
            esac
          fi

          if [[ "${CONTAINER_SCAN}" == "true" && -z "${GHCR_IMAGE}" ]]; then
            echo "::error::'container_scan' is enabled but 'ghcr_image' is not provided."
            errors=1
          fi

          if [[ "${errors}" -ne 0 ]]; then
            echo "::error::Input validation failed."
            exit 1
          fi

          echo "Input validation passed."

      - name: Generate sec tool script
        id: cmd
        env:
          SEC_TOOL: ${{ inputs.sec_tool }}
        run: |
          set -euo pipefail

          AUDIT_REPORT_DIRPATH="$(mktemp -d)"
          AUDIT_GENERATED=false

          script_path="$(mktemp --suffix=.sh)"

          case "${SEC_TOOL}" in
          npm)
              AUDIT_GENERATED=true
              cat > "${script_path}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          set +e
          npm audit --json > audit.json
          EXIT_CODE=$?
          set -e

          cat audit.json | npx audit-export --path "$AUDIT_REPORT_DIRPATH/audit-report.html"

          if [[ ! -s "$AUDIT_REPORT_DIRPATH/audit-report.html" ]]; then
            echo "::error::Audit report was not generated at $AUDIT_REPORT_DIRPATH/audit-report.html"
            exit 1
          fi

          CRITICAL_VULNS_COUNT=$(jq '.metadata.vulnerabilities.critical' audit.json)

          if [[ ${CRITICAL_VULNS_COUNT:-0} -gt 0 ]];
          then
                  echo "::error::Found $CRITICAL_VULNS_COUNT vulnerabilities with a severity of critical"
                  exit 1
          else
                  echo "No critical vulnerabilities found"
          fi
          EOF
              ;;
          pip)
              cat > "${script_path}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pip-audit

          set +e
          pip-audit
          EXIT_CODE=$?
          set -e

          if [[ ${EXIT_CODE} -ne 0 ]]; then
            echo "::error::pip-audit found vulnerabilities (exit code: ${EXIT_CODE})"
            exit 1
          else
            echo "No vulnerabilities found"
          fi
          EOF
              ;;
          composer)
              cat > "${script_path}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # Print full human-readable audit table (goes to stderr; don't abort on non-zero exit)
          composer audit || true

          # Gate on critical vulnerabilities only
          set +e
          CRITICAL_VULNS_COUNT=$(composer audit --format=json | jq '[.advisories[][] | select(.severity == "critical")] | length')
          EXIT_CODE=$?
          set -e

          if [[ ${CRITICAL_VULNS_COUNT:-0} -gt 0 ]];
          then
                  echo "::error::Found $CRITICAL_VULNS_COUNT vulnerabilities with a severity of critical"
                  exit 1
          else
                  echo "No critical vulnerabilities found"
          fi
          EOF
              ;;
          esac

          chmod +x "${script_path}"
          echo "Generated script at ${script_path}:"
          echo "----------------------------------------"
          cat "${script_path}"
          echo "----------------------------------------"

          echo "script_path=${script_path}" >> "$GITHUB_OUTPUT"
          echo "audit_report_dirpath=${AUDIT_REPORT_DIRPATH}" >> "$GITHUB_OUTPUT"
          echo "audit_generated=${AUDIT_GENERATED}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.ghcr_image != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run sec tool within container
        if: ${{ inputs.ghcr_image != '' }}
        env:
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          SCRIPT_PATH: ${{ steps.cmd.outputs.script_path }}
          AUDIT_REPORT_DIRPATH: ${{ steps.cmd.outputs.audit_report_dirpath }}
          IGNORE_VULNS: ${{ inputs.ignore_vulns }}
        run: |
          set -euo pipefail

          docker run --rm -i \
            -e AUDIT_REPORT_DIRPATH="$AUDIT_REPORT_DIRPATH" \
            -v "$AUDIT_REPORT_DIRPATH":"$AUDIT_REPORT_DIRPATH" \
            "${GHCR_IMAGE}" bash -s < "${SCRIPT_PATH}" || {
            if [[ "${IGNORE_VULNS}" != "true" ]]; then
              exit 1
            fi
            echo "::warning::Vulnerabilities found but ignored (ignore_vulns=true)."
          }

      - name: Configure AWS credentials for artifact fallback
        if: ${{ inputs.artifact_s3_bucket != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws_region }}

      - name: Download artifact
        id: download_artifact
        continue-on-error: true
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/artifact

      - name: Download artifact from S3 fallback
        if: ${{ inputs.artifact_name != '' && steps.download_artifact.outcome == 'failure' && inputs.artifact_s3_bucket != '' }}
        env:
          ARTIFACT_S3_BUCKET: ${{ inputs.artifact_s3_bucket }}
          ARTIFACT_S3_PATH: ${{ inputs.artifact_s3_path }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          artifact_s3_path="${ARTIFACT_S3_PATH#/}"
          artifact_s3_path="${artifact_s3_path%/}"
          source="s3://${ARTIFACT_S3_BUCKET}/${ARTIFACT_NAME}"
          if [[ -n "${artifact_s3_path}" ]]; then
            source="s3://${ARTIFACT_S3_BUCKET}/${artifact_s3_path}/${ARTIFACT_NAME}"
          fi
          mkdir -p /tmp/artifact
          aws s3 cp "${source}" "/tmp/artifact/${ARTIFACT_NAME}"

      - name: Fail when artifact download has no fallback
        if: ${{ inputs.artifact_name != '' && steps.download_artifact.outcome == 'failure' && inputs.artifact_s3_bucket == '' }}
        run: |
          echo "::error::GitHub artifact download failed and artifact_s3_bucket was not provided."
          exit 1

      - name: Run sec tool against artifact
        if: ${{ inputs.artifact_name != '' }}
        env:
          ARTIFACT_DIR: /tmp/artifact
          SCRIPT_PATH: ${{ steps.cmd.outputs.script_path }}
          AUDIT_REPORT_DIRPATH: ${{ steps.cmd.outputs.audit_report_dirpath }}
          IGNORE_VULNS: ${{ inputs.ignore_vulns }}
        run: |
          set -euo pipefail

          archive=$ARTIFACT_DIR/${{ inputs.artifact_name }}

          if [[ ! -f "${archive}" ]]; then
            echo "::error::${{ inputs.artifact_name }} not found in '${ARTIFACT_DIR}'."
            exit 1
          fi

          workdir="$(mktemp -d)"
          echo "Extracting ${archive} into ${workdir}"
          tar -xzf "${archive}" -C "${workdir}"

          cd "${workdir}"
          echo "Running generated script: ${SCRIPT_PATH}"
          bash "${SCRIPT_PATH}" || {
            if [[ "${IGNORE_VULNS}" != "true" ]]; then
              exit 1
            fi
            echo "::warning::Vulnerabilities found but ignored (ignore_vulns=true)."
          }

      - name: Upload audit report
        if: ${{ always() && steps.cmd.outputs.audit_generated == 'true' }}
        continue-on-error: true  # To account for storage quota limit
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.cmd.outputs.audit_report_dirpath }}/audit-report.html
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Trivy container scan
        if: ${{ inputs.container_scan == true }}
        continue-on-error: ${{ inputs.ignore_vulns }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.ghcr_image }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
